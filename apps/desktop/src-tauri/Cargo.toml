[package]
name = "promtesaver-desktop"
version = "0.9.0"
description = "Offline-first prompt library desktop host"
authors = ["promteSaver contributors"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
strip = true
lto = "thin"
codegen-units = 1

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
