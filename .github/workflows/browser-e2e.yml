name: Manual live browser acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - run: python scripts/browser-smoke.py --mode live --output qa-live
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-live-ui-${{ matrix.os }}
          path: qa-live
          retention-days: 7
